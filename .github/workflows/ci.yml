name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # CPU-only: image2lego itself never needs a GPU (see README's Install
    # section) -- the only GPU-requiring piece, services/trellis2/, is a
    # separately-run Docker service outside this package and isn't part of
    # this job.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: ruff check
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest
